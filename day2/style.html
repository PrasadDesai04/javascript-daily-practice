<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS: Style</title>
   
    <style>
        /*   internal css */
        p,span{
            background-color: orange;
        }
    </style>
     <!-- external file -->
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <!-- Inline CSS -->
    <p style="color:red; border:10px solid rgb(32, 253, 21);">this is paragraph</p>

    <span style="color:red; border:1px solid black;">This is inline tag by using span tag.</span>

    <h1>Heading 1</h1>
    <h2>Heading 3</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>heading 5</h5>
    <h6>heading 6</h6>
</body>
</html>
