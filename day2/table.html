<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>table</title>
  </head>
  <body>
    <table border="1px">
      <caption>
        Student Table
      </caption>
      <thead>
        <tr>
          <th>Name</th>
          <th>Age</th>
          <th>Roll No.</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td>Prasad</td>
          <td>22</td>
          <td>61</td>
        </tr>
        <tr>
            <td>"Yash</td>
            <td>21</td>
            <td>34</td>
        </tr>
      </tbody>
      <tfoot>
        <tr>
            <td rowspan="2">Total:</td>
            <td colspan="2">total student:2</td>
        </tr>
        <tr>
            <td colspan="2">avg age:22.5</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
