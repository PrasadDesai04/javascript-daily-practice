<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: radial-gradient(circle at top, #3b82f6, #0f172a 55%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #edf2f4;
            padding: 1.5rem;
        }

        .game-container {
            width: min(520px, 100%);
            padding: 2rem;
            border-radius: 30px;
            background: rgba(15, 23, 42, 0.96);
            box-shadow: 0 30px 90px rgba(15, 23, 42, 0.45);
            text-align: center;
            animation: floatIn 0.9s ease forwards;
            border: 1px solid rgba(255,255,255,0.08);
        }

        h1 {
            font-size: clamp(2rem, 2.5vw, 2.8rem);
            margin-bottom: 0.75rem;
            letter-spacing: 0.06em;
        }

        .hint {
            margin-bottom: 1.8rem;
            color: #94a3b8;
            font-size: 1rem;
        }

        .controls {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
            margin-bottom: 1.25rem;
        }

        input[type="number"] {
            flex: 1 1 180px;
            min-width: 170px;
            padding: 1rem 1.15rem;
            border-radius: 16px;
            border: 1px solid rgba(148, 163, 184, 0.25);
            background: rgba(255, 255, 255, 0.08);
            color: #f8fafc;
            font-size: 1rem;
            outline: none;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        input[type="number"]:focus {
            border-color: #60a5fa;
            background: rgba(255, 255, 255, 0.14);
            transform: translateY(-1px);
        }

        button {
            padding: 1rem 1.6rem;
            border: none;
            border-radius: 16px;
            background: linear-gradient(135deg, #38bdf8, #0ea5e9);
            color: #0f172a;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 0 16px 30px rgba(14, 165, 233, 0.25);
            transition: transform 0.2s ease, box-shadow 0.2s ease, filter 0.2s ease;
        }

        button:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 22px 35px rgba(14, 165, 233, 0.33);
        }

        button:disabled {
            opacity: 0.65;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        #result,
        #attempt {
            min-height: 1.5rem;
            margin-top: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.01em;
        }

        #result {
            font-size: 1rem;
            color: #e2e8f0;
        }

        #attempt {
            color: #a8dadc;
        }

        .pulse {
            animation: pulse 0.8s ease forwards;
        }

        @keyframes floatIn {
            from {
                opacity: 0;
                transform: translateY(28px) scale(0.98);
            }
            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes pulse {
            0% {
                transform: scale(0.98);
                opacity: 0.85;
            }
            50% {
                transform: scale(1.03);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
    </style>
</head>
<body>
    <div class="game-container">
        <h1>Welcome to number guessing game</h1>
        <p class="hint">Enter a number between 1 and 100</p>
        <div class="controls">
            <input type="number" id="guessInput" placeholder="Enter a number" min="1" max="100">
            <button id="guessButton">Guess</button>
        </div>
        <p id="result"></p>
        <p id="attempt"></p>
    </div>
    <script>
        const randomNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;
        const resultElement = document.getElementById('result');
        const attemptElement = document.getElementById('attempt');
        attemptElement.textContent = 'Attempts: 0';

        document.getElementById('guessButton').addEventListener('click', function() {
            const userGuess = parseInt(document.getElementById('guessInput').value, 10);
            attempts++;

            if (userGuess === randomNumber) {
                resultElement.textContent = `Congratulations! You've guessed the number ${randomNumber} in ${attempts} attempts.`;
                document.getElementById('guessButton').disabled = true;
            } else if (userGuess < randomNumber) {
                resultElement.textContent = 'Too low! Try again.';
            } else {
                resultElement.textContent = 'Too high! Try again.';
            }

            attemptElement.textContent = `Attempts: ${attempts}`;
            resultElement.classList.remove('pulse');
            void resultElement.offsetWidth;
            resultElement.classList.add('pulse');
        });
    </script>
</body>
</html>
