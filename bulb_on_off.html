<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <img id ="img" src="./bulb_off.png" alt="">
    <button onclick="turnOn()">Turn ON</button>
    <button onclick="turnoff()">Turn OFF</button>

    <script>
        let image=document.getElementById("img");

        function turnOn(){
            image.setAttribute('src','./bulb_on.png');
        }

        function turnoff(){
            image.setAttribute('src','./bulb_off.png');
        }
    </script>
</body>
</html>
