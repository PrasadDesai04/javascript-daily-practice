<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Form</title>
</head>
<body>
    <h1>Application Form</h1>

    <form action="">
        <label for="fname">First Name:</label>
        <input type="text" id="fname">

        <label for="lname">Last Name:</label>
        <input type="text" id="lname">
<br>
        <br>
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob">

        <label for="age">Age:</label>
        <input type="number" id="age">

        <br><br>
        <label for="gender">Gender:</label>
        <select name="" id="gender">
            <option value="gender">Male</option>
            <option value="">Female</option>
            <option value="">other</option>
        </select>

        
        <label for="email">Email Address:</label>
        <input type="email" id="email">

        <br><br>
        <label>Positions Available:</label>
        <input type="radio" id="jr_dev">
            <label for="jr-dev">Junior Developer</label>
        
        <input type="radio" id="mid-dev">
            <label for="mid-dev">Mid-level Developer</label>

        <input type="radio" id="s-dev">
            <label for="sdev">Senior Developer</label>

        <br><br>
        <label for="lang">programming Languages:</label>
            <input type="checkbox" id="cpp">
            <label for="java">Java</label>

             <input type="checkbox" id="cpp">
            <label for="javascript">JavaScript</label>

             <input type="checkbox" id="cpp">
            <label for="python">Python</label>   

            <br><br>
            <label for="pass">Password:</label>
            <input type="password" id="pass">

            
            <label for="cpass">Confirm Password:</label>
            <input type="password" id="cpass">
<br><br>
            <button type="submit">Submit</button>
            <button type="reset">Reset</button>
    </form>
</body>
</html>
